<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cursor Party!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 1px solid #000;
      overflow: hidden;
      transition: transform 0.3s ease;
      transform-origin: center;
      background: white;
    }
    #container.fullscreen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--scale-factor));
      border: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .cursor {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
    }
    .cursor img {
      width: 32px;
      height: 32px;
    }
    .cursor .username {
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 2px;
    }
    #controls {
      margin: 10px 0;
      z-index: 1000;
    }
    .fullscreen-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 5px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    .fullscreen-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="prompt" placeholder="Describe your cursor...">
    <button onclick="generateCursor()">Generate Cursor</button>
    <button onclick="toggleFullscreen()" class="fullscreen-btn">Toggle Fullscreen</button>
  </div>
  <div id="container"></div>

  <script type="importmap">
  {
    "imports": {
      "remove.bg": "https://unpkg.com/remove.bg@1.3.0/dist/removebg.min.js"
    }
  }
  </script>
  <script src="app.js"></script>
