<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cursor Party!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 1px solid #000;
      overflow: hidden;
      background-color: #f9f9f9;
    }
    #container.cursor-active {
      cursor: none;
    }
    .cursor {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
    }
    .cursor img {
      width: 32px;
      height: 32px;
    }
    .cursor .username {
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 2px;
    }
    #controls {
      margin: 10px 0;
    }
    #prompt {
      padding: 8px;
      width: 300px;
    }
    button {
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    h3 {
      margin: 10px 0 5px 0;
    }
    #gallery {
      margin: 10px 0;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      background: #f0f0f0;
    }
    
    .gallery-item {
      position: relative;
      width: 64px;
      height: 64px;
      border: 1px solid #ddd;
      cursor: pointer;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      border-radius: 5px;
      transition: all 0.2s ease;
    }
    
    .gallery-item:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
    
    .gallery-item img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    
    .gallery-item .prompt {
      font-size: 10px;
      text-align: center;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      white-space: nowrap;
    }
    .gallery-container {
      position: relative;
    }
    
    .page-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }
    
    .page-button {
      padding: 5px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .page-button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    
    #page-info {
      display: inline-block;
      margin: 0 10px;
    }
    #start-button {
      display: block;
      width: 200px;
      margin: 10px 0;
      padding: 12px 24px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    #start-button:hover {
      background: #45a049;
    }
    
    #start-button.active {
      background: #f44336;
    }
    
    .cursor-status {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
    
    .download-buttons {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }
    
    .download-btn {
      font-size: 10px;
      padding: 2px 4px;
      background: #666;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .download-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <h2>Cursor Party!</h2>
  <div id="controls">
    <input type="text" id="prompt" placeholder="Describe your cursor...">
    <button onclick="generateCursor()">Generate Cursor</button>
  </div>
  <h3>Cursor Gallery</h3>
  <div class="gallery-container">
    <div id="gallery"></div>
    <div class="page-buttons">
      <button id="prev-page" class="page-button" onclick="previousPage()">Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-page" class="page-button" onclick="nextPage()">Next</button>
    </div>
  </div>
  <h3>Playground</h3>
  <button id="start-button">Click to Start</button>
  <div class="cursor-status">Press ESC to show default cursor</div>
  <div id="container"></div>

  <script type="importmap">
  {
    "imports": {
      "remove.bg": "https://unpkg.com/remove.bg@1.3.0/dist/removebg.min.js",
      "pako": "https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm"
    }
  }
  </script>

</body>
</html>
