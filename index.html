<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cursor Party!</title>
  <style>
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 1px solid #000;
      overflow: hidden;
    }
    .cursor {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
    }
    .cursor img {
      width: 32px;
      height: 32px;
    }
    .cursor .username {
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 2px;
    }
    #controls {
      margin: 10px 0;
    }
    #gallery {
      margin: 10px 0;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ccc;
    }
    
    .gallery-item {
      position: relative;
      width: 64px;
      height: 64px;
      border: 1px solid #ddd;
      cursor: pointer;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .gallery-item:hover {
      background: #f0f0f0;
    }
    
    .gallery-item img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    
    .gallery-item .prompt {
      font-size: 10px;
      text-align: center;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="prompt" placeholder="Describe your cursor...">
    <button onclick="generateCursor()">Generate Cursor</button>
  </div>
  <div id="gallery"></div>
  <div id="container"></div>

  <script type="importmap">
  {

      "remove.bg": "https://unpkg.com/remove.bg@1.3.0/dist/removebg.min.js"
    }
  }
  </script>
  <script src="app.js"></script>

</html>
