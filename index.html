<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cursor Party!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Cursor Party!</h1>
      <p class="tagline">Create and share custom cursors with friends in real-time</p>
    </header>
    
    <section class="generator-section">
      <h2>Create Your Cursor</h2>
      <div id="controls">
        <input type="text" id="prompt" placeholder="Describe your cursor...">
        <button id="generate-button" class="primary-button">Generate Cursor</button>
      </div>
      <div id="loading-indicator" class="hidden">
        <div class="spinner"></div>
        <span>Creating your cursor...</span>
      </div>
    </section>
    
    <section class="gallery-section">
      <h2>Cursor Gallery</h2>
      <div class="gallery-container">
        <div id="gallery"></div>
        <div class="page-controls">
          <button id="prev-page" class="page-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span id="page-info">Page 1</span>
          <button id="next-page" class="page-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </section>
    
    <section class="playground-section">
      <h2>Cursor Playground</h2>
      <div class="playground-controls">
        <button id="start-button" class="toggle-button">Enter Playground</button>
        <div class="cursor-status">Press ESC to exit playground mode</div>
      </div>
      <div id="container" class="playground-container"></div>
      <div class="online-users">
        <span id="user-count">0</span> users in playground
      </div>
    </section>
  </div>

  <script type="importmap">
  {
    "imports": {
      "remove.bg": "https://unpkg.com/remove.bg@1.3.0/dist/removebg.min.js"
    }
  }
  </script>
  <script src="websocket.js"></script>
  <script src="gallery.js"></script>
  <script src="cursor.js"></script>
  <script src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
